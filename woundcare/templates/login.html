{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WoundPro_Ke</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        .medical-gradient {
            background: radial-gradient(circle at top right, #e0f2fe, #f0f7f9);
        }
    </style>
</head>

<body class="medical-gradient flex items-center justify-center min-h-screen p-4">

    <div class="bg-white/80 backdrop-blur-lg p-10 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.04)] w-full max-w-md border border-white">
        
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center mb-4">
                <img src="{% static 'images/logo.png' %}" 
                     alt="WoundPro Logo" 
                     class="h-24 w-auto object-contain">
            </div>
            
            
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 ml-1 mb-2">Username</label>
                <input type="text" name="username" placeholder="Enter your username" required
                    class="w-full p-4 rounded-2xl bg-gray-50/50 border-gray-100 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all outline-none text-gray-700 border">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 ml-1 mb-2">Password</label>
                <input type="password" name="password" placeholder="••••••••" required
                    class="w-full p-4 rounded-2xl bg-gray-50/50 border-gray-100 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all outline-none text-gray-700 border">
                
                <div class="flex justify-end mt-3">
                    <a href="#" class="text-xs font-bold text-blue-600 hover:text-blue-700 transition-colors">
                        Forgot Password?
                    </a>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-100 hover:bg-blue-700 hover:shadow-blue-200 active:scale-[0.98] transition-all duration-200 mt-2">
                Sign In
            </button>

            {% if messages %}
                <div class="mt-4 p-4 rounded-2xl bg-red-50 border border-red-100">
                    {% for message in messages %}
                        <p class="text-red-600 text-xs font-semibold text-center italic">
                            {{ message }}
                        </p>
                    {% endfor %}
                </div>
            {% endif %}
        </form>

        <div class="mt-10 pt-6 border-t border-gray-100 text-center">
            <p class="text-gray-400 text-[10px] uppercase tracking-widest leading-relaxed">
                Licensed for Clinical Use Only<br>
                &copy; 2026 WoundPro Kenya
            </p>
        </div>
    </div>

</body>
</html>
