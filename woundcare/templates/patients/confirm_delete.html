<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Patient</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-6 rounded-xl shadow-md w-full max-w-md">

    <h2 class="text-lg font-bold text-red-600 mb-3">Delete Patient</h2>

    <p class="text-sm text-gray-600 mb-4">
        Are you sure you want to delete
        <span class="font-bold">
            {{ patient.first_name }} {{ patient.surname }}
        </span>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit"
                class="w-full bg-red-600 text-white py-2 rounded-lg font-bold">
            Yes, Delete Patient
        </button>
    </form>

    <a href="{% url 'patient_detail' patient.id %}"
       class="block text-center mt-3 text-sm text-gray-500">
        Cancel
    </a>

</div>

</body>
</html>
