<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture Wound - WoundPro_Ke</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #F0F7F9; }
        .soft-card { border-radius: 2.5rem; }
        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 2.5rem;
            background: #000;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Viewfinder overlay */
        .viewfinder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 2rem;
            pointer-events: none;
        }
    </style>
</head>

<body class="font-sans">

<div class="max-w-md mx-auto p-5">

    <div class="flex items-center justify-between mb-6">
        <a href="javascript:history.back()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm text-gray-400">
            <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h1 class="text-lg font-bold text-gray-800">Wound Camera</h1>
        <div class="w-10"></div>
    </div>

    <div class="bg-white p-3 soft-card shadow-sm mb-6 border border-white">
        <div class="camera-container shadow-inner">
            <video id="video" autoplay playsinline></video>
            <div class="viewfinder"></div>
            
            <div class="absolute bottom-4 left-0 right-0 text-center">
                <span id="status-badge" class="bg-black/50 backdrop-blur-md text-white text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-wider">
                    Camera Active
                </span>
            </div>
        </div>
    </div>

    <div class="space-y-4">
        <button onclick="takePhoto()" 
            class="w-full bg-white text-gray-800 flex items-center justify-center gap-3 py-5 soft-card shadow-sm border border-gray-100 font-bold active:scale-95 transition-all">
            <div class="w-10 h-10 rounded-full border-4 border-blue-600 flex items-center justify-center">
                <div class="w-6 h-6 bg-blue-600 rounded-full"></div>
            </div>
            Capture Photo
        </button>

        <form method="POST" enctype="multipart/form-data" id="save-form" class="opacity-50 pointer-events-none transition-all duration-300">
            {% csrf_token %}
            <input type="hidden" name="image_data" id="image_data">
            <button type="submit" 
                class="w-full bg-blue-600 text-white flex items-center justify-center gap-3 py-4 soft-card shadow-lg shadow-blue-200 text-sm font-bold active:scale-95 transition-all">
                <i class="fa-solid fa-cloud-arrow-up"></i> Save to Patient File
            </button>
        </form>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <p class="text-center text-[11px] text-gray-400 mt-8 px-8 leading-relaxed">
        Center the wound within the <span class="font-bold">viewfinder</span> for the most accurate analysis.
    </p>

</div>

<script>
    const video = document.getElementById('video');
    const statusBadge = document.getElementById('status-badge');
    const saveForm = document.getElementById('save-form');

    // Access camera with high resolution preference
    navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment" } // Prefers back camera on mobile
    })
    .then(stream => {
        video.srcObject = stream;
    })
    .catch(err => {
        statusBadge.innerHTML = "Camera Error";
        statusBadge.classList.replace('bg-black/50', 'bg-red-500');
    });

    function takePhoto() {
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        context.drawImage(video, 0, 0);

        const dataURL = canvas.toDataURL('image/png');
        document.getElementById('image_data').value = dataURL;

        // Visual Feedback
        statusBadge.innerHTML = "✅ Captured Successfully";
        statusBadge.classList.replace('bg-black/50', 'bg-emerald-500');
        
        // Enable Save Button
        saveForm.classList.remove('opacity-50', 'pointer-events-none');
        
        // Haptic feedback (if supported)
        if (window.navigator.vibrate) window.navigator.vibrate(50);
    }
</script>

</body>
</html>
