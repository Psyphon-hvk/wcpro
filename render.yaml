services:
  - type: web
    name: woundcare
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: woundcare.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: woundcare-db
          property: connectionString

databases:
  - name: woundcare-db
    databaseName: woundcare
    user: woundcare
    plan: free